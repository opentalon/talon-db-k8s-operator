apiVersion: db.tlndb.io/v1alpha1
kind: TlnDB
metadata:
  name: tlndb-replicated
spec:
  mode: replicated
  replication:
    readReplicas: 2
    oplogRetention: 100000
  image:
    repository: ghcr.io/opentalon/tln-db
    tag: latest
    pullPolicy: IfNotPresent
  config:
    dbPath: /data/tlndb.bbolt
    tcp: ":9899"
    http: ":8080"
  storage:
    persistence:
      enabled: true
      size: 1Gi
      accessModes:
        - ReadWriteOnce
  observability:
    metrics:
      enabled: true
      port: 9090
# Writes: Service tlndb-replicated        (targets the single leader)
# Reads : Service tlndb-replicated-read   (load-balanced across followers)
